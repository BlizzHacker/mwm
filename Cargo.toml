[workspace]
resolver = "2"
members = ["crates/mdw-core", "crates/mdw-cli", "app/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["MoveWeight <hello@moveweight.com>"]
repository = "https://github.com/moveweight/mdw"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
blake3 = "1"
sysinfo = "0.33"
trash = "5"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
