name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p mwm-core
      - run: cargo build --release -p mwm-cli
      - name: UI syntax
        run: for f in app/ui/*.js; do node --check "$f"; done
