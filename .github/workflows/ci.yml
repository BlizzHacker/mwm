name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo test -p mwm-core
      - run: cargo build --release --target x86_64-unknown-linux-musl -p mwm-cli
      - uses: actions/upload-artifact@v4
        with:
          name: mwm-linux-amd64
          path: target/x86_64-unknown-linux-musl/release/mwm
          if-no-files-found: error
      - name: UI syntax
        run: for f in app/ui/*.js; do node --check "$f"; done
